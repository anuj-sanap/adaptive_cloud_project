version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SERVER_HOST=0.0.0.0
      - SERVER_API_KEY=${SERVER_API_KEY:-adaptive-demo-secret-key-12345}
      - TELEMETRY_DB_PATH=/app/data/telemetry.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - CORS_ORIGIN_REGEX=^https?://(localhost|127\.0\.0\.1)(:\d+)?$|^https://.*\.azurestaticapps\.net$
      - NODE_OFFLINE_THRESHOLD_SEC=30
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
    driver: local
